name: "pam_okta"
arch: ${DEBIAN_ARCH}
platform: "linux"
version: "0.5.0"
section: "default"
maintainer: "Ezekiel Hendrickson <ezekielh@devnull.mail.umich.edu>"
description: PAM module for Okta
homepage: "https://github.com/umich-iam/pam_okta"
license: "MIT"
contents:
  - src: ./target/release/libpam_okta.so
    dst: /usr/lib/${TARGET_TRIPLE}/security/pam_okta.so
    expand: true
  - src: ./doc/pam_okta.8
    dst: /usr/share/man/man8/pam_okta.8
  - src: ./packaging/pam_okta.toml
    dst: /etc/security/pam_okta.toml
    type: config|noreplace
    file_info:
      mode: 0600
      owner: root
      group: root
